{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Secretaria de Projetos{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <header class="masthead">
    <p class="masthead__eyebrow">Núcleo de Projetos Acadêmicos</p>
    <h1>Catálogo de Projetos e Equipes</h1>
    <nav>
      <a href="{% url 'academico:lista' %}">Projetos</a>
    </nav>
  </header>

  <main class="page">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    Registro acadêmico &middot; consulte a secretaria para atualizações cadastrais
  </footer>

</body>
</html>
